services:
  postgres:
    image: postgres:17
    container_name: minitrello-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minitrello
      POSTGRES_USER: minitrello
      POSTGRES_PASSWORD: minitrello
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minitrello -d minitrello"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
