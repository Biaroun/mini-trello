spring:
  application:
    name: minitrello
  datasource:
    url: jdbc:postgresql://localhost:15432/minitrello
    username: minitrello
    password: minitrello
  jpa:
    hibernate:
      ddl-auto: validate   # le schéma est géré uniquement par Flyway
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
